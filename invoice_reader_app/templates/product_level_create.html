{% extends 'base.html' %}

{% block title %}
    Thêm loại hàng
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        ⭐ Thêm loại hàng
                    </h5>
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label fw-semibold"
                            >
                                Tên loại hàng
                            </label>

                            <input
                                type="text"
                                name="name"
                                id="name"
                                class="form-control"
                                value="{{ name|default:'' }}"
                                placeholder="Ví dụ: Cao cấp"
                                required
                                autofocus
                            >

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                💾 Lưu
                            </button>

                            <a
                                href="{% url 'product_dmhh' %}"
                                class="btn btn-secondary"
                            >
                                ↩️ Quay lại
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
