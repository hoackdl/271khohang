<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thêm công việc</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            width: 95%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 17px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            Thêm công việc
        </h1>


        <form
            method="post"
            action="{% url 'work_task_create' %}"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="work_date">
                    Ngày
                </label>

                <input
                    type="date"
                    id="work_date"
                    name="work_date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Nội dung công việc
                </label>

                <textarea
                    id="content"
                    name="content"
                    required
                    placeholder="Nhập nội dung công việc..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="handler">
                    Người xử lý
                </label>

                <select
                    id="handler"
                    name="handler"
                >

                    <option value="">
                        -- Chưa phân công --
                    </option>

                    {% for user in users %}

                        <option value="{{ user.id }}">

                            {{ user.get_full_name|default:user.username }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="process_content">
                    Nội dung xử lý
                </label>

                <textarea
                    id="process_content"
                    name="process_content"
                    placeholder="Có thể để trống..."
                ></textarea>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Lưu công việc
                </button>

                <a
                    href="{% url 'work_task_list' %}"
                    class="btn btn-secondary"
                >
                    Quay lại
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
