<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hoàn thành công việc</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            width: 95%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .info-row {
            margin-bottom: 8px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 17px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            Hoàn thành công việc
        </h1>


        <div class="info">

            <div class="info-row">

                <strong>ID:</strong>

                #{{ task.id }}

            </div>


            <div class="info-row">

                <strong>Ngày:</strong>

                {{ task.work_date|date:"d/m/Y" }}

            </div>


            <div class="info-row">

                <strong>Nội dung:</strong>

                {{ task.content|linebreaksbr }}

            </div>


            <div class="info-row">

                <strong>Người xử lý:</strong>

                {% if task.handler %}

                    {{ task.handler.get_full_name|default:task.handler.username }}

                {% else %}

                    Chưa phân công

                {% endif %}

            </div>

        </div>


        <form
            method="post"
            action="{% url 'work_task_complete' task.pk %}"
        >

            {% csrf_token %}


            <label for="process_content">
                Nội dung xử lý / kết quả
            </label>

            <textarea
                id="process_content"
                name="process_content"
                placeholder="Nhập kết quả xử lý công việc..."
            >{{ task.process_content }}</textarea>


            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Xác nhận hoàn thành
                </button>

                <a
                    href="{% url 'work_task_list' %}"
                    class="btn btn-secondary"
                >
                    Hủy
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
