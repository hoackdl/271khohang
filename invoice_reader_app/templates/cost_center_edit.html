{% extends 'base.html' %}

{% block navbar_title %}
Sửa Trung tâm chi phí
{% endblock %}


{% block content %}

<div class="card">

    <div class="card-header bg-warning">
        Sửa trung tâm chi phí
    </div>


    <div class="card-body">

        <form method="post">

            {% csrf_token %}


            <div class="row">


                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        Mã trung tâm
                    </label>


                    <input type="text"
                           name="code"
                           class="form-control"
                           value="{{ cost_center.code }}"
                           required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label fw-bold">
                        Tên trung tâm
                    </label>


                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ cost_center.name }}"
                           required>

                </div>



                <div class="col-md-2 mb-3">

                    <label class="form-label fw-bold">
                        Trạng thái
                    </label>


                    <div class="form-check mt-2">

                        <input class="form-check-input"
                               type="checkbox"
                               name="is_active"
                               {% if cost_center.is_active %}
                               checked
                               {% endif %}>


                        <label class="form-check-label">
                            Hoạt động
                        </label>

                    </div>

                </div>


            </div>


            <button class="btn btn-primary">

                <i class="bi bi-save"></i>

                Lưu thay đổi

            </button>



            <a href="{% url 'cost_center_create' %}"
               class="btn btn-secondary">

                Quay lại

            </a>


        </form>

    </div>

</div>


{% endblock %}
