{% extends 'base.html' %}

{% block navbar_title %}
✏️ Sửa hàng đầu kỳ
{% endblock %}

{% block content %}

<style>
.product-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #ccc;
    z-index: 9999;
    max-height: 250px;
    overflow-y: auto;
    display: none;
}

.product-suggestion {
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.product-suggestion:hover {
    background: #f1f5f9;
}

.sku-wrapper {
    position: relative;
}
</style>


<div class="container-fluid py-3">

    <div class="card shadow-sm">

        <div class="card-header bg-warning
                    d-flex justify-content-between
                    align-items-center">

            <h5 class="mb-0">
                ✏️ SỬA HÀNG ĐẦU KỲ
            </h5>

            <a href="{% url 'inventory_opening_list' %}"
               class="btn btn-secondary btn-sm">
                ← Quay lại
            </a>

        </div>


        <div class="card-body">

            <form method="post">

                {% csrf_token %}


                <div class="row g-3">


                    <!-- ===================== -->
                    <!-- SKU -->
                    <!-- ===================== -->

                    <div class="col-md-3">

                        <label class="form-label">
                            SKU
                        </label>

                        <div class="sku-wrapper">

                            <input
                                type="text"
                                name="sku"
                                value="{{ opening.sku }}"
                                class="form-control sku-input"
                                id="skuInput"
                                autocomplete="off"
                                placeholder="Nhập SKU..."
                            >

                            <div
                                class="product-suggestions"
                                id="productSuggestions">
                            </div>

                        </div>

                    </div>


                    <!-- ===================== -->
                    <!-- TÊN GỌI CHUNG -->
                    <!-- ===================== -->

                    <div class="col-md-5">

                        <label class="form-label">
                            Tên gọi chung
                        </label>

                        <input
                            type="text"
                            name="ten_goi_chung"
                            id="productName"
                            value="{{ opening.ten_goi_chung }}"
                            class="form-control"
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- ĐVT -->
                    <!-- ===================== -->

                    <div class="col-md-2">

                        <label class="form-label">
                            ĐVT
                        </label>

                        <input
                            type="text"
                            name="unit"
                            id="productUnit"
                            value="{{ opening.unit }}"
                            class="form-control"
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- NGÀY -->
                    <!-- ===================== -->

                    <div class="col-md-2">

                        <label class="form-label">
                            Ngày
                        </label>

                        <input
                            type="date"
                            name="ngay"
                            value="{{ opening.ngay|date:'Y-m-d' }}"
                            class="form-control"
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- SỐ LƯỢNG -->
                    <!-- ===================== -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Số lượng
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="so_luong"
                            id="so_luong"
                            value="{{ opening.so_luong }}"
                            class="form-control"
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- ĐƠN GIÁ -->
                    <!-- ===================== -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Đơn giá
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="don_gia"
                            id="don_gia"
                            value="{{ opening.don_gia }}"
                            class="form-control"
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- THÀNH TIỀN -->
                    <!-- ===================== -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Thành tiền
                        </label>

                        <input
                            type="text"
                            id="thanh_tien"
                            class="form-control"
                            readonly
                        >

                    </div>


                    <!-- ===================== -->
                    <!-- GHI CHÚ -->
                    <!-- ===================== -->

                    <div class="col-md-12">

                        <label class="form-label">
                            Ghi chú
                        </label>

                        <textarea
                            name="ghi_chu"
                            class="form-control"
                            rows="3"
                        >{{ opening.ghi_chu }}</textarea>

                    </div>

                </div>


                <!-- ===================== -->
                <!-- BUTTON -->
                <!-- ===================== -->

                <div class="mt-4 d-flex justify-content-between">

                    <a
                        href="{% url 'inventory_opening_list' %}"
                        class="btn btn-secondary"
                    >
                        Hủy
                    </a>


                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        💾 Lưu thay đổi
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>


// =====================================================
// FORMAT NUMBER
// =====================================================

function formatNumber(number) {

    return new Intl.NumberFormat(
        'vi-VN'
    ).format(number || 0);

}


// =====================================================
// TÍNH THÀNH TIỀN
// =====================================================

function calculateAmount() {

    const qty =
        parseFloat(
            document.getElementById("so_luong").value
        ) || 0;


    const price =
        parseFloat(
            document.getElementById("don_gia").value
        ) || 0;


    const amount =
        qty * price;


    document.getElementById(
        "thanh_tien"
    ).value =
        formatNumber(amount);

}


// =====================================================
// EVENT TÍNH TIỀN
// =====================================================

document
    .getElementById("so_luong")
    .addEventListener(
        "input",
        calculateAmount
    );


document
    .getElementById("don_gia")
    .addEventListener(
        "input",
        calculateAmount
    );


// Tính ngay khi mở trang
calculateAmount();


// =====================================================
// TÌM SẢN PHẨM
// =====================================================

let searchTimer = null;


const skuInput =
    document.getElementById(
        "skuInput"
    );


const suggestionBox =
    document.getElementById(
        "productSuggestions"
    );


const productName =
    document.getElementById(
        "productName"
    );


const productUnit =
    document.getElementById(
        "productUnit"
    );


skuInput.addEventListener(
    "input",
    function () {

        const keyword =
            this.value.trim();


        clearTimeout(
            searchTimer
        );


        if (!keyword) {

            suggestionBox.innerHTML = "";

            suggestionBox.style.display =
                "none";

            return;

        }


        searchTimer =
            setTimeout(
                function () {

                    searchProducts(
                        keyword
                    );

                },
                250
            );

    }
);


// =====================================================
// API SEARCH
// =====================================================

function searchProducts(keyword) {

    fetch(
        "{% url 'products_search_v2' %}?q="
        + encodeURIComponent(keyword)
    )

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP "
                    + response.status
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            suggestionBox.innerHTML = "";


            if (
                !data.results ||
                !data.results.length
            ) {

                suggestionBox.style.display =
                    "none";

                return;

            }


            data.results.forEach(
                function (product) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "product-suggestion";


                    const sku =
                        product.sku || "";


                    const name =
                        product.ten_goi_chung ||
                        product.ten_hang ||
                        "";


                    const unit =
                        product.unit ||
                        product.dvt ||
                        "";


                    item.innerHTML = `
                        <strong>
                            ${escapeHtml(sku)}
                        </strong>
                        -
                        ${escapeHtml(name)}
                        ${
                            unit
                                ? `<span class="text-muted">
                                    (${escapeHtml(unit)})
                                   </span>`
                                : ""
                        }
                    `;


                    item.addEventListener(
                        "click",
                        function () {

                            selectProduct(
                                product
                            );

                        }
                    );


                    suggestionBox.appendChild(
                        item
                    );

                }
            );


            suggestionBox.style.display =
                "block";

        }
    )

    .catch(
        error => {

            console.error(
                "Lỗi tìm sản phẩm:",
                error
            );

            suggestionBox.style.display =
                "none";

        }
    );

}


// =====================================================
// CHỌN SẢN PHẨM
// =====================================================

function selectProduct(product) {

    skuInput.value =
        product.sku || "";


    productName.value =
        product.ten_goi_chung ||
        product.ten_hang ||
        "";


    productUnit.value =
        product.unit ||
        product.dvt ||
        "";


    suggestionBox.innerHTML = "";


    suggestionBox.style.display =
        "none";

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text || "";


    return div.innerHTML;

}


// =====================================================
// CLICK RA NGOÀI → ĐÓNG GỢI Ý
// =====================================================

document.addEventListener(
    "click",
    function (event) {

        if (
            !event.target.closest(
                ".sku-wrapper"
            )
        ) {

            suggestionBox.style.display =
                "none";

        }

    }
);

</script>

{% endblock %}
